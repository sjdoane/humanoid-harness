[project]
name = "humanoid-harness"
version = "0.1.0"
description = "Agentic research harness for reference-oracle and task-reward design"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Samuel Doane" }]
dependencies = [
    "numpy>=2.5,<3",
    "pydantic>=2.13,<3",
]

[project.scripts]
humanoid-harness = "oracle_composition.cli:main"
humanoid-fixed-reference = "oracle_composition.experiments.cli:main"
humanoid-oracle-exploration = "oracle_composition.experiments.oracle_exploration_runner:main"
humanoid-reference-probe = "oracle_composition.experiments.reference_causal_probe:main"
humanoid-static-study-summary = "oracle_composition.experiments.study_summary:main"

[project.optional-dependencies]
sources = [
    "h5py>=3.12,<4",
]
gym = [
    "gymnasium[mujoco]>=1.3,<2",
    "mujoco>=3.12,<4",
]
train = [
    "stable-baselines3>=2.9,<3",
    "torch>=2.14,<3",
]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_composition"]

[tool.hatch.build.targets.wheel.force-include]
"uv.lock" = "oracle_composition/_runtime/uv.lock"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gym: requires the Gymnasium MuJoCo extras",
    "slow: measured training or multi-episode evaluation",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["archive", "research/evidence/legacy_policy_harness_kg"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
